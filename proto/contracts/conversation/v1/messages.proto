syntax = "proto3";

package zvonilka.conversation.v1;

import "contracts/common/v1/messages.proto";
import "contracts/conversation/v1/models.proto";

option go_package = "github.com/dm-vev/zvonilka/gen/proto/contracts/conversation/v1;conversationv1";

message ListMessagesRequest {
  string conversation_id = 1;
  zvonilka.common.v1.PageRequest page = 2;
  string thread_id = 3;
  bool include_reactions = 4;
  bool include_deleted = 5;
  bool include_forwarded = 6;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  zvonilka.common.v1.PageResponse page = 2;
}

message ListScheduledMessagesRequest {
  string conversation_id = 1;
  zvonilka.common.v1.PageRequest page = 2;
  string thread_id = 3;
  bool include_failed = 4;
}

message ListScheduledMessagesResponse {
  repeated Message messages = 1;
  zvonilka.common.v1.PageResponse page = 2;
}

message GetMessageRequest {
  string conversation_id = 1;
  string message_id = 2;
}

message GetMessageResponse {
  Message message = 1;
}

message SendMessageRequest {
  string conversation_id = 1;
  zvonilka.common.v1.MessageDraft draft = 2;
  string idempotency_key = 3;
}

message SendMessageResponse {
  Message message = 1;
  zvonilka.common.v1.EventEnvelope event = 2;
}

message TranslateMessageRequest {
  string conversation_id = 1;
  string message_id = 2;
  string target_language = 3;
  string source_language = 4;
  bool force_refresh = 5;
}

message TranslateMessageResponse {
  MessageTranslation translation = 1;
}

message EditMessageRequest {
  string conversation_id = 1;
  string message_id = 2;
  zvonilka.common.v1.MessageDraft draft = 3;
  string idempotency_key = 4;
}

message EditMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  string conversation_id = 1;
  string message_id = 2;
  bool delete_for_everyone = 3;
  string reason = 4;
  string idempotency_key = 5;
}

message DeleteMessageResponse {
  Message message = 1;
}

message ForwardMessageRequest {
  string from_conversation_id = 1;
  string message_id = 2;
  string to_conversation_id = 3;
  string idempotency_key = 4;
}

message ForwardMessageResponse {
  Message message = 1;
}

message AddReactionRequest {
  string conversation_id = 1;
  string message_id = 2;
  string emoji = 3;
  string idempotency_key = 4;
}

message AddReactionResponse {
  Message message = 1;
}

message RemoveReactionRequest {
  string conversation_id = 1;
  string message_id = 2;
  string emoji = 3;
  string idempotency_key = 4;
}

message RemoveReactionResponse {
  Message message = 1;
}

message GetReactionCatalogRequest {
  string known_version = 1;
}

message GetReactionCatalogResponse {
  string version = 1;
  repeated EmojiReactionDefinition reactions = 2;
  string default_emoji = 3;
  bool not_modified = 4;
}

message TriggerCallbackQueryRequest {
  string conversation_id = 1;
  string message_id = 2;
  string data = 3;
}

message TriggerCallbackQueryResponse {
  string callback_query_id = 1;
}

message GetCallbackQueryAnswerRequest {
  string callback_query_id = 1;
}

message GetCallbackQueryAnswerResponse {
  bool answered = 1;
  string text = 2;
  string url = 3;
  bool show_alert = 4;
  uint32 cache_time = 5;
}

message TriggerInlineQueryRequest {
  string bot_user_id = 1;
  string query = 2;
  string offset = 3;
  string chat_type = 4;
}

message TriggerInlineQueryResponse {
  string inline_query_id = 1;
}

message GetInlineQueryAnswerRequest {
  string inline_query_id = 1;
}

message InlineQueryResult {
  string type = 1;
  string id = 2;
  string title = 3;
  string description = 4;
  string caption = 5;
  string message_text = 6;
  string reply_markup_json = 7;
  string photo_url = 8;
  string audio_url = 9;
  string document_url = 10;
  string gif_url = 11;
  string mpeg4_url = 12;
  string video_url = 13;
  string mime_type = 14;
  string thumb_url = 15;
}

message GetInlineQueryAnswerResponse {
  bool answered = 1;
  repeated InlineQueryResult results = 2;
  string next_offset = 3;
  string switch_pm_text = 4;
  string switch_pm_parameter = 5;
}

message SendInlineQueryResultRequest {
  string inline_query_id = 1;
  string result_id = 2;
  string conversation_id = 3;
  string reply_message_id = 4;
}

message SendInlineQueryResultResponse {
  Message message = 1;
}

message GetBotCommandsRequest {
  string bot_user_id = 1;
  string language_code = 2;
}

message BotCommand {
  string command = 1;
  string description = 2;
}

message GetBotCommandsResponse {
  repeated BotCommand commands = 1;
}

message PinMessageRequest {
  string conversation_id = 1;
  string message_id = 2;
  bool pin_for_everyone = 3;
  string idempotency_key = 4;
}

message PinMessageResponse {
  Message message = 1;
}

message UnpinMessageRequest {
  string conversation_id = 1;
  string message_id = 2;
  string idempotency_key = 3;
}

message UnpinMessageResponse {
  Message message = 1;
}

message MarkReadRequest {
  string conversation_id = 1;
  string message_id = 2;
  uint64 read_through_sequence = 3;
  string idempotency_key = 4;
}

message MarkReadResponse {
  uint64 read_through_sequence = 1;
}

message SetTypingRequest {
  string conversation_id = 1;
  bool typing = 2;
}

message SetTypingResponse {}
