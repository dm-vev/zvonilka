syntax = "proto3";

package zvonilka.notification.v1;

import "contracts/notification/v1/requests.proto";

option go_package = "github.com/dm-vev/zvonilka/gen/proto/contracts/notification/v1;notificationv1";

service NotificationService {
  rpc GetNotificationPreference(GetNotificationPreferenceRequest) returns (GetNotificationPreferenceResponse);
  rpc SetNotificationPreference(SetNotificationPreferenceRequest) returns (SetNotificationPreferenceResponse);
  rpc GetConversationNotificationOverride(GetConversationNotificationOverrideRequest) returns (GetConversationNotificationOverrideResponse);
  rpc SetConversationNotificationOverride(SetConversationNotificationOverrideRequest) returns (SetConversationNotificationOverrideResponse);
  rpc DeleteConversationNotificationOverride(DeleteConversationNotificationOverrideRequest) returns (DeleteConversationNotificationOverrideResponse);
  rpc GetScopeNotificationSettings(GetScopeNotificationSettingsRequest) returns (GetScopeNotificationSettingsResponse);
  rpc SetScopeNotificationSettings(SetScopeNotificationSettingsRequest) returns (SetScopeNotificationSettingsResponse);
  rpc GetReactionNotificationSettings(GetReactionNotificationSettingsRequest) returns (GetReactionNotificationSettingsResponse);
  rpc SetReactionNotificationSettings(SetReactionNotificationSettingsRequest) returns (SetReactionNotificationSettingsResponse);
  rpc ListSavedNotificationSounds(ListSavedNotificationSoundsRequest) returns (ListSavedNotificationSoundsResponse);
  rpc AddSavedNotificationSound(AddSavedNotificationSoundRequest) returns (AddSavedNotificationSoundResponse);
  rpc RemoveSavedNotificationSound(RemoveSavedNotificationSoundRequest) returns (RemoveSavedNotificationSoundResponse);
  rpc ListPushTokens(ListPushTokensRequest) returns (ListPushTokensResponse);
  rpc RegisterPushToken(RegisterPushTokenRequest) returns (RegisterPushTokenResponse);
  rpc RevokePushToken(RevokePushTokenRequest) returns (RevokePushTokenResponse);
}
