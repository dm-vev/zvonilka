syntax = "proto3";

package zvonilka.notification.v1;

import "contracts/notification/v1/models.proto";

option go_package = "github.com/dm-vev/zvonilka/gen/proto/contracts/notification/v1;notificationv1";

message GetNotificationPreferenceRequest {}

message GetNotificationPreferenceResponse {
  NotificationPreference preference = 1;
}

message SetNotificationPreferenceRequest {
  NotificationPreference preference = 1;
}

message SetNotificationPreferenceResponse {
  NotificationPreference preference = 1;
}

message GetConversationNotificationOverrideRequest {
  string conversation_id = 1;
}

message GetConversationNotificationOverrideResponse {
  ConversationNotificationOverride override = 1;
}

message SetConversationNotificationOverrideRequest {
  ConversationNotificationOverride override = 1;
}

message SetConversationNotificationOverrideResponse {
  ConversationNotificationOverride override = 1;
}

message DeleteConversationNotificationOverrideRequest {
  string conversation_id = 1;
}

message DeleteConversationNotificationOverrideResponse {}

message GetScopeNotificationSettingsRequest {
  NotificationSettingsScope scope = 1;
}

message GetScopeNotificationSettingsResponse {
  ScopeNotificationSettings settings = 1;
}

message SetScopeNotificationSettingsRequest {
  ScopeNotificationSettings settings = 1;
}

message SetScopeNotificationSettingsResponse {
  ScopeNotificationSettings settings = 1;
}

message GetReactionNotificationSettingsRequest {}

message GetReactionNotificationSettingsResponse {
  ReactionNotificationSettings settings = 1;
}

message SetReactionNotificationSettingsRequest {
  ReactionNotificationSettings settings = 1;
}

message SetReactionNotificationSettingsResponse {
  ReactionNotificationSettings settings = 1;
}

message ListSavedNotificationSoundsRequest {}

message ListSavedNotificationSoundsResponse {
  repeated SavedNotificationSound sounds = 1;
}

message AddSavedNotificationSoundRequest {
  string media_id = 1;
  string title = 2;
}

message AddSavedNotificationSoundResponse {
  SavedNotificationSound sound = 1;
}

message RemoveSavedNotificationSoundRequest {
  int64 sound_id = 1;
}

message RemoveSavedNotificationSoundResponse {}

message ListPushTokensRequest {}

message ListPushTokensResponse {
  repeated PushToken push_tokens = 1;
}

message RegisterPushTokenRequest {
  string provider = 1;
  string token = 2;
}

message RegisterPushTokenResponse {
  PushToken push_token = 1;
}

message RevokePushTokenRequest {
  string token_id = 1;
}

message RevokePushTokenResponse {
  PushToken push_token = 1;
}
