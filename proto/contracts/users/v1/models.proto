syntax = "proto3";

package zvonilka.users.v1;

import "google/protobuf/timestamp.proto";
import "contracts/common/v1/messages.proto";
import "contracts/common/v1/types.proto";

option go_package = "github.com/dm-vev/zvonilka/gen/proto/contracts/users/v1;usersv1";

enum ContactSource {
  CONTACT_SOURCE_UNSPECIFIED = 0;
  CONTACT_SOURCE_MANUAL = 1;
  CONTACT_SOURCE_IMPORTED = 2;
  CONTACT_SOURCE_SYNCED = 3;
  CONTACT_SOURCE_INVITED = 4;
}

message UserProfile {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  repeated zvonilka.common.v1.Avatar avatars = 5;
  string phone = 6;
  string email = 7;
  bool verified = 8;
  string custom_badge_emoji = 9;
  zvonilka.common.v1.PresenceState presence = 10;
  string custom_status = 11;
  google.protobuf.Timestamp last_seen_at = 12;
  PrivacySettings privacy = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  bool is_contact = 16;
  bool is_blocked = 17;
  zvonilka.common.v1.AccountKind account_kind = 18;
}

message PrivacySettings {
  zvonilka.common.v1.Visibility phone_visibility = 1;
  zvonilka.common.v1.Visibility last_seen_visibility = 2;
  zvonilka.common.v1.Visibility message_privacy = 3;
  zvonilka.common.v1.Visibility birthday_visibility = 4;
  bool allow_contact_sync = 5;
  bool allow_unknown_senders = 6;
  bool allow_username_search = 7;
}

enum ReactionNotificationSource {
  REACTION_NOTIFICATION_SOURCE_UNSPECIFIED = 0;
  REACTION_NOTIFICATION_SOURCE_NONE = 1;
  REACTION_NOTIFICATION_SOURCE_CONTACTS = 2;
  REACTION_NOTIFICATION_SOURCE_ALL = 3;
}

message MediaDownloadSettings {
  bool enabled = 1;
  int64 max_photo_bytes = 2;
  int64 max_video_bytes = 3;
  int64 max_file_bytes = 4;
  bool preload_large_videos = 5;
  bool preload_next_audio = 6;
  bool preload_stories = 7;
  bool use_less_data_for_calls = 8;
}

message AutoDownloadSettings {
  MediaDownloadSettings mobile = 1;
  MediaDownloadSettings wifi = 2;
  MediaDownloadSettings roaming = 3;
}

message MediaAutosaveSettings {
  bool photos = 1;
  bool videos = 2;
  int64 max_video_bytes = 3;
}

message AutosaveSettings {
  MediaAutosaveSettings private_chats = 1;
  MediaAutosaveSettings group_chats = 2;
  MediaAutosaveSettings channel_chats = 3;
}

message BrowserDomainException {
  string domain = 1;
  bool open_external = 2;
}

message BrowserSettings {
  bool open_external = 1;
  bool display_close_button = 2;
  repeated BrowserDomainException exceptions = 3;
}

message ReactionNotificationSettings {
  ReactionNotificationSource message_reactions = 1;
  ReactionNotificationSource story_reactions = 2;
  ReactionNotificationSource poll_votes = 3;
  string sound_id = 4;
  bool show_preview = 5;
}

message AccountSettings {
  uint32 account_ttl_days = 1;
  uint32 inactive_session_ttl_days = 2;
  string default_reaction = 3;
  uint32 default_message_auto_delete_seconds = 4;
  AutoDownloadSettings auto_download = 5;
  AutosaveSettings autosave = 6;
  BrowserSettings browser = 7;
  ReactionNotificationSettings reaction_notifications = 8;
  bool allow_new_chats_from_unknown_users = 9;
  int64 incoming_paid_message_star_count = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message Contact {
  string contact_user_id = 1;
  string display_name = 2;
  string username = 3;
  string phone_hash = 4;
  ContactSource source = 5;
  bool starred = 6;
  google.protobuf.Timestamp added_at = 7;
}

message BlockEntry {
  string blocked_user_id = 1;
  string reason = 2;
  google.protobuf.Timestamp blocked_at = 3;
}

message SyncedContact {
  string raw_contact_id = 1;
  string display_name = 2;
  string phone_e164 = 3;
  string email = 4;
  string checksum = 5;
}

message ContactMatch {
  string raw_contact_id = 1;
  string contact_user_id = 2;
  string display_name = 3;
  string username = 4;
}
